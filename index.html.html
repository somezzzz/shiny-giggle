<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GRATEFUL ME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Pixelify+Sans:wght@400;700&display=swap">
<style>
:root {
  --bg:#FBF3FF; --grid:#F1E6FF; --ink:#4B3F72; --soft:#7B6FA8; --pink:#FFB6D5; --pink2:#F58FBF;
  --lav:#E6D9FF; --ind:#8F8AEE; --blue:#CFE8FA; --mint:#CDF3CB; --yel:#FFFBB8; --shadow:#D6CCFA;
}
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px);
  background-size:24px 24px;
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; font-size:15.5px; line-height:1.85; }
.wrap { max-width:560px; margin:0 auto; padding:24px 18px 56px; min-height:100vh; }
svg.spr { display:block; image-rendering:pixelated; }

h1 { font-weight:400; text-align:center; margin:0; }
.brand { font-family:'Pixelify Sans','Press Start 2P',monospace; font-weight:700; font-size:clamp(30px, 10.5vw, 46px); letter-spacing:2px; line-height:1.2; margin:4px 0 6px; }
.sub { font-family:'Pixelify Sans',monospace; font-size:15px; letter-spacing:.5px; color:var(--soft); text-align:center; margin:0 0 26px; line-height:1.6; }
.ask { display:block; font-family:Jua,'Gowun Dodum',sans-serif; font-size:19px; margin:0 0 10px; line-height:1.5; }
h2 { display:flex; align-items:center; gap:10px; font-family:Jua,'Gowun Dodum',sans-serif; font-size:21px; font-weight:400; margin:0 0 12px; line-height:1.4; }
h2 .ic { flex:0 0 auto; }

.hero { position:relative; height:140px; margin-bottom:6px; }
.hero .cloud { position:absolute; left:50%; top:22px; transform:translateX(-50%); }
.hero .fl { position:absolute; animation:bob 2.4s steps(2) infinite; }
.hero .a { left:2%; top:34px; } .hero .b { left:22%; top:2px; animation-delay:.6s; }
.hero .c { right:3%; top:6px; animation-delay:1.2s; } .hero .d { right:20%; top:96px; animation-delay:.3s; }
@keyframes bob { 0% { transform:translateY(0); } 50% { transform:translateY(-4px); } 100% { transform:translateY(0); } }

.all { display:block; width:100%; min-height:280px; resize:vertical; background:#fff; color:var(--ink); border:3px solid var(--ind);
  box-shadow:4px 4px 0 var(--shadow); padding:14px; font:inherit; font-size:16px; line-height:1.9; border-radius:0; }
.all::placeholder { color:#B7ADD8; }
.all:focus { outline:3px solid var(--pink); outline-offset:2px; }
.count { margin-top:12px; text-align:center; color:var(--soft); font-size:13px; }

.btn { display:block; width:100%; margin-top:14px; padding:13px 10px; text-align:center; font-family:Jua,'Gowun Dodum',sans-serif; font-size:18px; color:var(--ink);
  background:var(--pink); border:3px solid var(--ind); box-shadow:4px 4px 0 var(--ind); cursor:pointer; border-radius:0; }
.btn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ind); }
.btn:focus-visible { outline:3px dashed var(--ink); outline-offset:3px; }
.btn:disabled { background:#EFE9FA; color:#A79FC7; border-color:#C4BDE6; box-shadow:4px 4px 0 #DAD4F1; cursor:not-allowed; }
.btn.ghost { background:#fff; }
.lbl { position:relative; }
.file { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }

.notice { margin:0 0 14px; padding:10px 12px; background:#fff; border:3px dashed var(--ind); font-size:14px; line-height:1.7; }
.err { margin-top:16px; padding:10px 12px; background:#FFE3EA; border:3px solid var(--pink2); font-size:14px; line-height:1.7; }

.reading { text-align:center; padding:30px 0; }
.thumb { max-width:100%; max-height:180px; border:3px solid var(--ind); box-shadow:4px 4px 0 var(--shadow); background:#fff; margin-bottom:22px; }
.fly { overflow:hidden; height:44px; margin-bottom:6px; display:flex; justify-content:center; }
.flyer { animation:fly 1.6s steps(8) infinite alternate; }
@keyframes fly { from { transform:translateX(-40px); } to { transform:translateX(40px); } }
.rt { font-family:Jua,'Gowun Dodum',sans-serif; font-size:20px; }
.bar { height:22px; border:3px solid var(--ind); background:#fff; margin:16px 0 10px; box-shadow:3px 3px 0 var(--shadow); }
.bar > i { display:block; height:100%; width:4%; transition:width .3s steps(8);
  background:repeating-linear-gradient(90deg, var(--pink) 0 8px, var(--pink2) 8px 10px); }
#status { font-size:14px; color:var(--soft); }

.rtop { display:flex; justify-content:center; margin:4px 0 12px; }
.title { font-family:Jua,'Gowun Dodum',sans-serif; font-size:28px; line-height:1.45; margin:6px 0 16px; }
.summary { margin:0 0 22px; line-height:1.95; }

.win { position:relative; background:#fff; border:3px solid var(--ind); box-shadow:4px 4px 0 var(--shadow); padding:16px; }
.win.lav { background:var(--lav); }
.win.pink { background:#FFEAF4; }
.corner { position:absolute; top:-18px; right:10px; }
.verse { margin:22px 0 16px; padding-top:20px; }
.verse .ref { font-family:Jua,'Gowun Dodum',sans-serif; font-size:26px; line-height:1.4; margin:0 0 8px; }
.verse p { margin:0 0 6px; line-height:1.8; }
.verse .why { color:var(--soft); }
.vlink { display:inline-block; margin-top:12px; padding:7px 14px; background:#fff; color:var(--ink); border:3px solid var(--ind); box-shadow:3px 3px 0 var(--ind); text-decoration:none; font-size:14px; }
.vlink:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ind); }
.verse2 { margin:0 0 20px; font-size:14px; line-height:1.75; }
.verse2 b { display:block; font-weight:400; margin-bottom:4px; }
.verse2 span { color:var(--soft); display:block; }
.vlink2 { display:inline-block; margin-top:8px; color:var(--ink); font-size:14px; }

.div { height:4px; margin:26px 0 20px; background:repeating-linear-gradient(90deg, var(--ind) 0 8px, transparent 8px 16px); }
.sec { margin-bottom:4px; }
.trait { margin-bottom:16px; }
.trait b { display:block; font-family:Jua,'Gowun Dodum',sans-serif; font-weight:400; font-size:18px; margin-bottom:3px; }
.trait p { margin:0 0 4px; color:var(--soft); font-size:13px; }
.trait q { display:block; background:#fff; border:2px solid var(--ind); padding:7px 10px; font-size:14px; line-height:1.65; quotes:"“" "”"; }

.drow { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:14px; }
.dl { flex:0 0 84px; }
.dbar { flex:1; height:18px; border:2px solid var(--ind); background:#fff; }
.dbar > i { display:block; height:100%; background:repeating-linear-gradient(90deg, var(--pink) 0 8px, var(--pink2) 8px 10px); }
.dn { flex:0 0 36px; text-align:right; color:var(--soft); font-size:13px; }
.small { color:var(--soft); font-size:12px; margin:4px 0 8px; }

.chips { display:flex; flex-wrap:wrap; gap:10px; }
.chip { padding:3px 12px; border:2px solid var(--ind); box-shadow:2px 2px 0 var(--ind); font-size:14px; }
.c0 { background:var(--pink); } .c1 { background:var(--blue); } .c2 { background:var(--mint); } .c3 { background:var(--lav); }

.letterbox { padding-top:22px; }
.letter { margin:0; white-space:pre-line; line-height:2; }

.disc { color:var(--soft); font-size:12px; text-align:center; margin-top:26px; line-height:1.8; }
@media (prefers-reduced-motion: reduce) { .hero .fl, .flyer { animation:none; } .bar > i { transition:none; } }
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script>
// ==ANALYSIS_START
var QUESTIONS = [
  '이번 주 가장 크게 감사했던 순간은 언제였나요?',
  '그 감사를 누구와 가장 나누고 싶나요?',
  '감사를 적으면서 내 마음은 어떻게 달라졌나요?',
  '다음 주에 새롭게 감사해 보고 싶은 것은 무엇인가요?',
  '힘든 중에도 발견한 감사가 있다면 무엇인가요?',
  '이번 주 말씀 한 구절을 내 삶에 어떻게 적용해 볼 수 있을까요?'
];
// head: "~는" 꾸밈말, trait: "~사람" / 제목은 (두 번째 주제의 head) + (첫 번째 주제의 trait) 로 조합돼요.
const CATS = [
  { id:'people', label:'사람', head:'사람을 아끼는', trait:'사람에게서 힘을 얻는 사람',
    descs:['함께한 사람들을 가장 먼저 떠올리는 경향이 보여요.','감사의 이야기 속에 늘 누군가가 등장해요.'],
    values:['관계','연결'],
    kw:['가족','엄마','아빠','어머니','아버지','부모','동생','언니','오빠','누나','친구','동료','선생','쌤','선배','후배','남편','아내','아이가','아이들','아이와','아들','딸','연인','남자친구','여자친구','이웃','지인','팀원','교수','사랑','만남','사람','얼굴','반가','만나','카톡','연락','안부','돌아왔','동기','팀장','공동체','모임','새가족','초대','동역','마주'],
    verses:[
      { ref:'잠언 17:17', meaning:'참된 친구는 어떤 상황에서도 변함없이 사랑한다는 말이에요.', why:'곁에 있는 사람들을 소중히 여기는 마음과 잘 어울려요.' },
      { ref:'전도서 4:9', meaning:'혼자보다 둘이 함께할 때 더 좋은 열매를 얻는다는 말이에요.', why:'사람과 함께할 때 힘을 얻는 모습과 닮았어요.' },
      { ref:'요한일서 4:7', meaning:'서로 사랑하자는 권면이에요.', why:'관계 속에서 감사를 찾는 마음과 이어져요.' }
    ],
    notes:['감사가 사람에게 많이 향해 있어요. 나 자신에게 고마운 점도 한 줄 적어 보면 어떨까요?','사람이 큰 힘이 되는 만큼, 혼자 있는 시간의 감사도 함께 찾아보면 균형이 잡혀요.'],
    nexts:['이번 주에는 고마운 사람 한 명에게 직접 감사를 전해 보세요.','이번 주에는 고마운 사람에게 짧은 메시지를 보내 보세요.'] },

  { id:'food', label:'음식', head:'작은 즐거움을 놓치지 않는', trait:'맛있는 한 끼에서 기쁨을 찾는 사람',
    descs:['한 끼의 맛과 나눔에서 기쁨을 찾는 경향이 보여요.','먹고 마시는 일상의 순간을 즐거움으로 기억해요.'],
    values:['여유','즐거움'],
    kw:['음식','식사','밥','맛','먹었','먹을','먹고','커피','간식','점심','저녁','요리','김치','빵','케이크','디저트','배불','명절','치킨','고기','떡','아이스크림','최애','김밥','야식','포케','샤인머스켓','사탕','알밥','쨈','피스타치오','배달음식'],
    verses:[
      { ref:'전도서 9:7', meaning:'즐거운 마음으로 먹고 마시는 일도 하나님이 주신 선물이라는 뜻이에요.', why:'일상의 작은 즐거움을 놓치지 않는 모습과 닮았어요.' },
      { ref:'시편 34:8', meaning:'하나님이 선하심을 맛보아 알라는 초대의 말이에요.', why:'맛있는 순간을 감사로 이어 가는 마음과 잘 맞아요.' },
      { ref:'사도행전 2:46', meaning:'초대 교회 사람들이 기쁜 마음으로 음식을 나눴다는 기록이에요.', why:'함께 먹는 시간을 귀하게 여기는 모습과 이어져요.' }
    ],
    notes:['즐거움이 주로 먹는 것에 모여 있어요. 음식 말고 나를 쉬게 하는 것도 하나 찾아보면 좋아요.','맛있는 기억이 감사로 이어지는 건 좋은 습관이에요. 함께 먹은 사람도 같이 적어 보세요.'],
    nexts:['이번 주에는 음식이 아닌 소소한 즐거움을 하나 적어 보세요.','이번 주에는 누군가와 나눠 먹은 순간을 기록해 보세요.'] },

  { id:'rest', label:'쉼과 건강', head:'몸과 마음을 살피는', trait:'컨디션과 쉼에 민감한 사람',
    descs:['몸 상태와 쉼에 민감하게 반응하는 경향이 보여요.','건강과 컨디션이 하루의 감사에 크게 자리해요.'],
    values:['돌봄','쉼'],
    kw:['건강','잠을','잘잤','푹쉬','푹잤','숙면','휴식','쉼','쉬었','쉴','컨디션','회복','운동','피곤','몸','병원','나았','못자','쉬는','쉬어','쉬고','편하','힐링','충전','늦잠','연차','낮잠','꿀잠','아무것도안','아무것도 안','러닝','달리','조깅','헬스','체력','못 자'],
    verses:[
      { ref:'마태복음 11:28', meaning:'지치고 무거운 짐을 진 사람에게 와서 쉬라고 초대하는 말이에요.', why:'지친 날에도 쉼과 회복에 마음을 두는 모습과 맞닿아 있어요.' },
      { ref:'시편 127:2', meaning:'사랑하는 자에게 잠을 선물로 주신다는 노래예요.', why:'잘 쉬는 것을 감사로 여기는 마음과 어울려요.' },
      { ref:'시편 23:2', meaning:'푸른 풀밭과 잔잔한 물가로 이끄는 목자의 모습이에요.', why:'몸과 마음을 돌보는 시간과 이어져요.' }
    ],
    notes:['컨디션이 감사의 기준이 되는 편이에요. 몸이 힘든 날에도 고마운 점을 찾는 연습이 이미 되어 있어요.','몸의 신호를 잘 알아채는 사람이에요. 쉴 수 있었던 순간도 꼭 기록해 두세요.'],
    nexts:['이번 주에는 충분히 쉬었던 순간을 하나 기록해 보세요.','이번 주에는 내 몸에게 고마운 점을 한 가지 적어 보세요.'] },

  { id:'work', label:'일과 배움', head:'맡은 일에 진심인', trait:'맡은 일을 성실히 감당하는 사람',
    descs:['일상의 역할과 배움을 감사로 바라보는 경향이 보여요.','일과 공부 속에서 성장의 기쁨을 발견해요.'],
    values:['성실','성장'],
    kw:['근무','출근','퇴근','업무','직장','일터','공부','시험','배움','배우','지혜','성장','도전','성과','합격','프로젝트','과제','해보','방법','일하','일할','일해','일했','환자','나이트','당직','입원','격리','수업','교육','연구','강의','스터디','자격증','바빴','바쁜','바쁠','바쁘','정신없','정신 없','최선','애써'],
    verses:[
      { ref:'골로새서 3:23', meaning:'무슨 일이든 사람이 아닌 하나님께 하듯 마음을 다해 하라는 말이에요.', why:'맡은 자리에서 최선을 다하는 태도와 잘 어울려요.' },
      { ref:'잠언 16:3', meaning:'네가 하는 일을 하나님께 맡기라는 말이에요.', why:'일을 성실히 하되 결과는 내려놓는 모습과 닮았어요.' },
      { ref:'갈라디아서 6:9', meaning:'선을 행하다가 낙심하지 말라는 격려예요.', why:'지치는 날에도 꾸준히 해 나가는 모습과 이어져요.' }
    ],
    notes:['일과 성장이 감사의 중심에 있어요. 일 밖에서 나를 채우는 시간도 함께 챙겨 주세요.','열심히 사는 만큼 쉼도 감사의 대상이에요. 일을 내려놓은 순간도 적어 보세요.'],
    nexts:['이번 주에는 일과 상관없는 감사를 두 가지 적어 보세요.','이번 주에는 일을 마친 뒤의 나에게 칭찬 한마디를 적어 보세요.'] },

  { id:'achieve', label:'해낸 일', head:'끝까지 해내는', trait:'해낸 일을 기억하는 사람',
    descs:['작은 성취를 지나치지 않고 기억하는 경향이 보여요.','마무리와 인정의 순간을 감사로 남겨요.'],
    values:['성취','자신감'],
    kw:['해냈','완성','끝냈','이뤘','성취','통과','칭찬','인정','잘했','챌린지','감챌','꾸준','습관'],
    verses:[
      { ref:'빌립보서 4:13', meaning:'나에게 힘을 주시는 분 안에서 모든 일을 감당할 수 있다는 고백이에요.', why:'해낸 일을 감사로 연결하는 마음과 어울려요.' },
      { ref:'시편 90:17', meaning:'우리 손의 일을 견고하게 해 달라는 기도예요.', why:'애써 이룬 일을 소중히 여기는 모습과 닮았어요.' }
    ],
    notes:['해낸 일을 기억하는 건 좋은 습관이에요. 그 과정에서 도와준 사람도 함께 떠올려 보세요.','성취를 적을 때 과정의 노력도 한 줄 더하면 자신감이 오래 가요.'],
    nexts:['이번 주에는 크기와 상관없이 해낸 일을 세 가지 적어 보세요.','이번 주에는 해낸 일 뒤에 숨은 나의 노력을 한 줄 적어 보세요.'] },

function hashText(raw) {
  var s = (raw || '').replace(/\s+/g, ''); var h = 7;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function pick(arr, h, salt) { return arr[(h + salt) % arr.length]; }

function cleanOcr(text) {
  var t = (text || '').replace(/\r/g, '');
  t = t.replace(/\s*(\d{1,2})\s*[.)]\s*(?=[가-힣])/g, '\n');
  var lines = t.split('\n').map(function (line) {
    var l = line.trim();
    var tokens = l.split(/\s+/);
    var hangulTokens = tokens.filter(function (x) { return /[가-힣]/.test(x); });
    if (hangulTokens.length >= 4) {
      var avg = hangulTokens.reduce(function (s, x) { return s + x.length; }, 0) / hangulTokens.length;
      if (avg < 1.6) l = l.replace(/([가-힣])\s+(?=[가-힣])/g, '$1');
    }
    return l.replace(/\s{2,}/g, ' ');
  });
  return lines.filter(function (l) { return (l.match(/[가-힣]/g) || []).length >= 3; }).join('\n');
}

function splitLines(raw) {
  var t = (raw || '').replace(/\r/g, '');
  t = t.replace(/\s*(\d{1,2})\s*[.)]\s*(?=[가-힣])/g, '\n');
  return t.split('\n').map(function (l) { return l.trim(); })
    .filter(function (l) { return (l.match(/[가-힣]/g) || []).length >= 3; });
}

function shorten(line) {
  var s = line.replace(/^\d+\s*[.)]\s*/, '').trim();
  return s.length > 38 ? s.slice(0, 38) + '…' : s;
}

// '힘들지 않고', '피곤하지 않은'처럼 부정하는 말이 바로 뒤에 오면, 그 단어는 세지 않아요
var NEG_WORDS = ['힘들', '어려', '걱정', '불안', '눈물', '피곤', '아프', '외롭', '우울', '지치', '혼란'];
var NEG_AFTER = /^하?지(는|도)?\s?(않|못)/;
function hasKeyword(l, ns, k) {
  var isNeg = NEG_WORDS.indexOf(k) !== -1;
  function scan(text) {
    var from = 0, i;
    while ((i = text.indexOf(k, from)) !== -1) {
      if (!isNeg || !NEG_AFTER.test(text.slice(i + k.length, i + k.length + 6))) return true;
      from = i + k.length;
    }
    return false;
  }
  return scan(l) || (k.length >= 3 && scan(ns));
}

// 사람 이름이나 사람 단어 없이 '~해 주셔서', '~하심에'처럼 높임말만 있으면, 하나님께 하는 감사로 봐요
var DIVINE = /(주셔서|주시고|주시니|주시는|주심|하심|하시니|하시고|하시는|해\s?주시|허락|계심|계시|계셔|이끄시|인도하)/;
function hasPeopleSubject(l, ns) {
  var p = CATS.filter(function (c) { return c.id === 'people'; })[0];
  return p.kw.some(function (k) { return hasKeyword(l, ns, k); });
}

function scoreLines(lines) {
  return CATS.map(function (c) {
    var hitLines = []; var hits = 0;
    lines.forEach(function (l) {
      var ns = l.replace(/\s+/g, '');
      // 원문에서 먼저 찾고, 3글자 이상 단어는 띄어쓰기 오류까지 감안해 붙여서도 찾아요 (단어 경계가 겹쳐 생기는 오인식 방지)
      var found = c.kw.filter(function (k) { return hasKeyword(l, ns, k); });
      if (c.id === 'faith' && !found.length && DIVINE.test(l) && !hasPeopleSubject(l, ns)) found = ['(존칭)'];
      if (found.length) { hitLines.push(l); hits += found.length; }
    });
    return { c: c, lineCount: hitLines.length, hits: hits, hitLines: hitLines };
  }).filter(function (x) { return x.lineCount > 0; })
    .sort(function (a, b) { return (b.lineCount - a.lineCount) || (b.hits - a.hits); });
}

function analyze(input) {
  var lines = Array.isArray(input)
    ? input.map(function (l) { return String(l).replace(/\s+/g, ' ').trim(); }).filter(function (l) { return /[가-힣]/.test(l); })
    : splitLines(input);
  var raw = lines.join('\n');
  var scored = scoreLines(lines);
  if (!scored.length) {
    var dflt = Object.assign({}, DEFAULT_RESULT);
    dflt.letter = DEFAULT_LETTERS[Math.floor(Math.random() * DEFAULT_LETTERS.length)];
    return dflt;
  }

  var h = hashText(raw);
  var top = scored.slice(0, 3);
  var first = top[0];
  var second = top[1];
  var n = lines.length;

  // 제목: 두 번째 주제의 꾸밈말 + 첫 번째 주제의 성향
  var title = second ? (second.c.head + ', ' + first.c.trait) : first.c.trait;

  // 요약
  var labels = top.slice(0, 2).map(function (x) { return '‘' + x.c.label + '’'; }).join(', ');
  var summary = '기록에서 ' + labels + ' 이야기가 가장 자주 보여요. ' + pick(first.c.descs, h, 0) +
    (second ? ' ' + pick(second.c.descs, h, 1) : '');

  // 성경 구절 (주제 + 글 내용에 따라 달라져요)
  var verse = pick(first.c.verses, h, 0);
  var verse2;
  if (second) {
    var v2 = pick(second.c.verses, h, 1);
    verse2 = { ref: v2.ref, meaning: v2.meaning };
  } else if (first.c.verses.length > 1) {
    var v2b = pick(first.c.verses, h, 1);
    if (v2b.ref === verse.ref) v2b = first.c.verses[(first.c.verses.indexOf(verse) + 1) % first.c.verses.length];
    verse2 = { ref: v2b.ref, meaning: v2b.meaning };
  }

  // 성향 3가지 + 근거 문장
  var used = [];
  var traits = top.map(function (x) {
    var p = x.hitLines.filter(function (l) { return used.indexOf(l) === -1; })[0] || x.hitLines[0];
    used.push(p);
    return { name: x.c.trait, evidence: shorten(p) };
  });

  // 감사 분포
  var dist = scored.slice(0, 5).map(function (x) { return { label: x.c.label, count: x.lineCount }; });

  // 가치 키워드
  var values = [];
  top.forEach(function (x) { x.c.values.forEach(function (v) { if (values.indexOf(v) === -1) values.push(v); }); });
  values = values.slice(0, 5);

  // 흐름: 앞부분 vs 뒷부분
  var flow;
  if (n >= 4) {
    var mid = Math.floor(n / 2);
    var a = scoreLines(lines.slice(0, mid))[0];
    var b = scoreLines(lines.slice(mid))[0];
    if (a && b && a.c.id !== b.c.id) flow = '처음에는 ‘' + a.c.label + '’, 뒤로 갈수록 ‘' + b.c.label + '’ 쪽으로 마음이 옮겨 갔어요.';
    else if (a && b) flow = '처음부터 끝까지 ‘' + a.c.label + '’ 이야기가 이어졌어요.';
    else flow = '총 ' + n + '가지 중 ' + first.lineCount + '가지가 ‘' + first.c.label + '’ 이야기예요.';
  } else {
    flow = '총 ' + n + '가지 중 ' + first.lineCount + '가지가 ‘' + first.c.label + '’ 이야기예요. 기록이 더 쌓이면 흐름도 보여요.';
  }

  // 감사 스타일: 집중형 / 다양형 / 균형형
  var style;
  if (n >= 3 && first.lineCount / n >= 0.6) style = '한 가지 주제를 깊이 파고드는 집중형이에요.';
  else if (scored.length >= 4) style = '여러 곳에서 감사를 찾아내는 다양형이에요.';
  else style = '두세 가지 주제를 고르게 오가는 균형형이에요.';

  // 글 길이
  var avgLen = lines.reduce(function (s, l) { return s + l.replace(/^\d+\s*[.)]\s*/, '').replace(/\s+/g, '').length; }, 0) / n;
  var detail = avgLen >= 28 ? '이유와 장면까지 자세히 적는 편이에요.'
    : avgLen <= 14 ? '핵심만 간결하게 적는 편이에요.'
    : '적당한 길이로 담백하게 적는 편이에요.';

  // 편지: 첫 번째 주제의 편지 2편 중 무작위로 한 편
  var pool = LETTERS[first.c.id] || DEFAULT_LETTERS;
  var letter = pool[Math.floor(Math.random() * pool.length)];

  // 짧은 나눔글 + 함께 나눌 질문
  var nextText = pick(first.c.nexts, h, 1);
  var openers = [
    '이번 주 감사를 적어 보니 ' + labels + ' 이야기가 가장 많았어요.',
    '한 주를 돌아보며 감사를 적었더니 ' + labels + ' 이야기가 가장 많이 보였어요.'
  ];
  var shareText = pick(openers, h, 0) + ' 그중 “' + traits[0].evidence + '” 이 부분이 특히 마음에 남아요. ' +
    '함께 읽고 싶은 말씀: ' + verse.ref + '. ' +
    nextText.replace(/^이번 주에는 /, '다음 주에는 ').replace(/보세요\.$/, '볼게요.').replace(/해 보세요\.$/, '해 볼게요.');
  var qi = h % QUESTIONS.length;
  var questions = [QUESTIONS[qi], QUESTIONS[(qi + 3) % QUESTIONS.length]];

  return {
    title: title, summary: summary, verse: verse, verse2: verse2, traits: traits,
    dist: dist, total: n, values: values, flow: flow, style: style, detail: detail,
    note: pick(first.c.notes, h, 0), next: nextText, letter: letter,
    share: { text: shareText, questions: questions }
  };
}

function newGrid(W, H) { var g = []; for (var y = 0; y < H; y++) { var r = []; for (var x = 0; x < W; x++) r.push('.'); g.push(r); } return g; }
function stamp(g, rows, ox, oy) {
  for (var y = 0; y < rows.length; y++) for (var x = 0; x < rows[y].length; x++) {
    var c = rows[y].charAt(x);
    if (c !== '.' && g[oy + y] && typeof g[oy + y][ox + x] !== 'undefined') g[oy + y][ox + x] = c;

function makeCloud() {
  var W = 34, H = 20, g = newGrid(W, H);
  stamp(g, STAR_FACE, 19, 0);
  stamp(g, STAR_S, 5, 4);
  var circles = [[8, 14, 4.6], [15, 11.5, 6.2], [23, 12.5, 5.6], [28.5, 14.5, 4.2]];
  function inside(x, y) {
    if (y > 17) return false;
    if (x >= 8 && x <= 28 && y >= 14) return true;
    for (var i = 0; i < circles.length; i++) {
      var dx = x + 0.5 - circles[i][0], dy = y + 0.5 - circles[i][1];
      if (dx * dx + dy * dy <= circles[i][2] * circles[i][2]) return true;
    }
    return false;
  }
  var map = [];
  for (var y = 0; y < H; y++) { map.push([]); for (var x = 0; x < W; x++) map[y].push(inside(x, y)); }
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    if (!map[y][x]) continue;
    var edge = x === 0 || y === 0 || x === W - 1 || y === H - 1 || !map[y][x - 1] || !map[y][x + 1] || !map[y - 1][x] || !map[y + 1][x];
    g[y][x] = edge ? 'P' : (y >= 16 ? 'q' : 'w');
  }
  stamp(g, HEART, 13, 10);
  stamp(g, HEART_S.map(function (r) { return r.replace(/h/g, 'p'); }), 6, 12);
  stamp(g, HEART_S.map(function (r) { return r.replace(/h/g, 'p'); }), 25, 12);
  return g.map(function (r) { return r.join(''); });
}

function makeShoot() {
  var W = 34, H = 11, g = newGrid(W, H);
  var rows = [[3, 'p', 6, 22], [4, 'p', 3, 22], [5, 'b', 1, 22], [6, 'b', 1, 22], [7, 'v', 3, 22], [8, 'v', 6, 22]];
  rows.forEach(function (r) { for (var x = r[2]; x <= r[3]; x++) g[r[0]][x] = r[1]; });
  [[8, 5], [14, 6], [18, 5], [11, 4], [5, 7]].forEach(function (p) { g[p[1]][p[0]] = 'w'; });
  stamp(g, STAR, 23, 0);
  return g.map(function (r) { return r.join(''); });
}

function spr(grid, scale, cls) {
  var H = grid.length, W = grid[0].length, rects = '';
  for (var y = 0; y < H; y++) {
    var x = 0;
    while (x < W) {
      var c = grid[y].charAt(x);
      if (c === '.' || !PAL[c]) { x++; continue; }
      var x2 = x; while (x2 < W && grid[y].charAt(x2) === c) x2++;
      rects += '<rect x="' + x + '" y="' + y + '" width="' + (x2 - x) + '" height="1" fill="' + PAL[c] + '"/>';
      x = x2;
    }
  }
  return '<svg class="spr ' + (cls || '') + '" width="' + (W * scale) + '" height="' + (H * scale) + '" viewBox="0 0 ' + W + ' ' + H +
    '" shape-rendering="crispEdges" aria-hidden="true" focusable="false">' + rects + '</svg>';
}

}

function countMsg() { var n = filled(); return n + '개 적었어요' + (n < 3 ? ' · 최소 3개를 적어 주세요' : n < 7 ? ' · 7개를 채우면 더 정확해요' : ''); }
function bibleLink(ref) { return 'https://search.naver.com/search.naver?query=' + encodeURIComponent(ref + ' 개역개정'); }
function h2(text) { return '<h2>' + spr(SPARKLE, 3, 'ic') + '<span>' + esc(text) + '</span></h2>'; }
function divider() { return '<div class="div" aria-hidden="true"></div>'; }

function render() {
  var h = '';
  if (state.stage === 'write') {
    h += '<div class="hero">' +
      '<span class="fl a">' + spr(BUBBLE, 4) + '</span>' +
      '<span class="fl b">' + spr(SPARKLE, 4) + '</span>' +
      '<span class="fl c">' + spr(BUBBLE, 3) + '</span>' +
      '<span class="fl d">' + spr(SPARKLE, 3) + '</span>' +
      '<span class="cloud">' + spr(CLOUD, 5) + '</span></div>' +
      '<h1 class="brand">GRATEFUL ME</h1><p class="sub">Discover yourself through gratitude</p>';
    if (state.notice) h += '<p class="notice">' + esc(state.notice) + '</p>';
    h += '<label class="ask" for="all">이번 한 주 가장 감사한 일 7개를 적어 주세요</label>' +
      '<textarea class="all" id="all" aria-label="이번 주 감사한 일" placeholder="한 줄에 하나씩 적어 주세요.&#10;&#10;예)&#10;1. 가족과 함께 저녁을 먹을 수 있어서 감사&#10;2. 일이 잘 마무리돼서 감사&#10;3. 친구가 응원해 줘서 감사">' + esc(state.text) + '</textarea>' +
      '<div class="count" id="count">' + countMsg() + '</div>' +
      '<button class="btn" id="go"' + (filled() < 3 ? ' disabled' : '') + '>Discover me</button>' +
      '<label class="btn ghost lbl">일기 사진으로 불러오기<input class="file" id="file" type="file" accept="image/*" /></label>' +
      (state.error ? '<div class="err">' + esc(state.error) + '</div>' : '');
  } else if (state.stage === 'ocr') {
    h += '<div class="reading">' +
      (state.photo ? '<img class="thumb" src="' + state.photo + '" alt="올린 사진" />' : '') +
      '<div class="fly">' + spr(SHOOT, 4, 'flyer') + '</div>' +
      '<div class="rt">사진 속 글을 읽고 있어요</div>' +
      '<div class="bar"><i id="bar"></i></div><div id="status">준비 중</div></div>';
  } else if (state.stage === 'result' && state.result) {
    var r = state.result;
    h += '<div class="rtop">' + spr(SHOOT, 4) + '</div>' +
      '<h1 class="title">' + esc(r.title) + '</h1>' +
      '<p class="summary">' + esc(r.summary) + '</p>' +
      '<div class="win lav verse"><span class="corner">' + spr(STAR_FACE, 4) + '</span>' +
      '<p class="ref">' + esc(r.verse.ref) + '</p><p>' + esc(r.verse.meaning) + '</p><p class="why">' + esc(r.verse.why) + '</p>' +
      '<a class="vlink" href="' + bibleLink(r.verse.ref) + '" target="_blank" rel="noopener noreferrer">개역개정 본문 읽기</a></div>' +
      (r.verse2 ? '<div class="win verse2"><b>함께 읽어 볼 구절 · ' + esc(r.verse2.ref) + '</b><span>' + esc(r.verse2.meaning) + '</span>' +
        '<a class="vlink2" href="' + bibleLink(r.verse2.ref) + '" target="_blank" rel="noopener noreferrer">개역개정 본문 읽기</a></div>' : '') +
      divider() +
      '<div class="sec">' + h2('보이는 성향') +
      r.traits.map(function (t) {
        return '<div class="trait"><b>' + esc(t.name) + '</b>' +
          (t.evidence ? '<p>이런 부분에서 읽었어요</p><q>' + esc(t.evidence) + '</q>' : '') + '</div>';
      }).join('') + '</div>' +
      (r.dist && r.dist.length ? divider() + '<div class="sec">' + h2('감사가 모인 곳') +
        r.dist.map(function (d) {
          var w = Math.max(10, Math.round(d.count / Math.max(1, r.total) * 100));
          return '<div class="drow"><span class="dl">' + esc(d.label) + '</span><span class="dbar"><i style="width:' + w + '%"></i></span><span class="dn">' + d.count + '줄</span></div>';
        }).join('') + '<p class="small">한 줄이 여러 주제에 해당할 수 있어요.</p></div>' : '') +
      divider() +
      '<div class="sec">' + h2('소중히 여기는 것') + '<div class="chips">' +
      r.values.map(function (v, i) { return '<span class="chip c' + (i % 4) + '">' + esc(v) + '</span>'; }).join('') + '</div></div>' +
      divider() +
      '<div class="sec">' + h2('당신에게 보내는 편지') +
      '<div class="win pink letterbox"><span class="corner">' + spr(BUBBLE, 3) + '</span><p class="letter">' + esc(r.letter) + '</p></div></div>' +
      '<button class="btn ghost" id="edit">내용 고쳐서 다시 보기</button>' +
      '<button class="btn ghost" id="again">새로 쓰기</button>' +
      '<div class="disc">AI가 아니라 단어를 기준으로 한 가벼운 해석이에요. 심리 검사나 진단이 아니에요.<br>성경 구절은 뜻 풀이만 담았어요. 개역개정 본문은 위 링크에서 직접 읽어 주세요.</div>';
  }
  app.innerHTML = h;
  bind();
}

function bind() {
  var $ = function (id) { return document.getElementById(id); };
  if ($('all')) $('all').addEventListener('input', function (e) {
    state.text = e.target.value;
    var c = $('count'); if (c) c.textContent = countMsg();
    var g = $('go'); if (g) g.disabled = filled() < 3;
  });
  if ($('file')) $('file').addEventListener('change', onFile);
  if ($('go')) $('go').addEventListener('click', function () {
    state.error = ''; state.notice = '';
    state.result = analyze(parseEntries(state.text));
    state.stage = 'result'; render(); window.scrollTo(0, 0);
  });
  if ($('edit')) $('edit').addEventListener('click', function () { state.stage = 'write'; render(); window.scrollTo(0, 0); });
  if ($('again')) $('again').addEventListener('click', function () { state = { stage: 'write', text: '', photo: '', notice: '', error: '', result: null }; render(); window.scrollTo(0, 0); });
}
// ---------- 사진 읽기(OCR) ----------
function prepCanvas(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 2200, min = 1400;
      var long = Math.max(img.width, img.height);
      var scale = long > max ? max / long : (Math.min(img.width, img.height) < min ? Math.min(2, min / Math.min(img.width, img.height)) : 1);
      var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      var d = ctx.getImageData(0, 0, w, h), p = d.data;
      for (var i = 0; i < p.length; i += 4) {
        var g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
        g = (g - 128) * 1.35 + 128; g = g < 0 ? 0 : g > 255 ? 255 : g;
        p[i] = p[i + 1] = p[i + 2] = g;
      }
      ctx.putImageData(d, 0, 0);
      var thumb = document.createElement('canvas');
      var ts = Math.min(1, 600 / Math.max(img.width, img.height));
      thumb.width = Math.round(img.width * ts); thumb.height = Math.round(img.height * ts);
      thumb.getContext('2d').drawImage(img, 0, 0, thumb.width, thumb.height);
      URL.revokeObjectURL(url);
      resolve({ canvas: c, thumb: thumb.toDataURL('image/jpeg', 0.8) });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('사진을 열 수 없어요. JPG나 PNG, 스크린샷으로 올려 주세요.')); };
    img.src = url;
  });
}

function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = function () { reject(new Error('엔진을 불러오지 못했어요')); };
    document.head.appendChild(s);
  });
}

async function loadTesseract() {
  if (window.Tesseract) return;
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js'); }
  catch (e) { await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'); }
  if (!window.Tesseract) throw new Error('엔진을 불러오지 못했어요');
}

var STATUS = {
  'loading tesseract core': '엔진 준비 중',
  'initializing tesseract': '엔진 준비 중',
  'loading language traineddata': '한글 데이터 내려받는 중 (처음 한 번만, 1분쯤 걸려요)',
  'initializing api': '준비 중',
  'recognizing text': '글자 읽는 중'
};

function onLog(m) {
  var bar = document.getElementById('bar'), st = document.getElementById('status');
  if (st && STATUS[m.status]) st.textContent = STATUS[m.status];
  if (bar && typeof m.progress === 'number') {
    var base = m.status === 'recognizing text' ? 0.3 : 0;
    var span = m.status === 'recognizing text' ? 0.7 : 0.3;
    bar.style.width = Math.max(4, Math.round((base + span * m.progress) * 100)) + '%';
  }
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('시간이 너무 오래 걸려요')); }, ms); })]);
}

async function onFile(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  state.stage = 'ocr'; state.photo = ''; state.error = ''; state.notice = '';
  render();
  try {
    var prep = await prepCanvas(file);
    state.photo = prep.thumb;
    var imgEl = document.querySelector('.thumb');
    if (!imgEl) { render(); } else { imgEl.src = prep.thumb; }
    await loadTesseract();
    var res = await withTimeout(window.Tesseract.recognize(prep.canvas, 'kor', { logger: onLog }), 150000);
    var lines = cleanOcr(res.data.text).split('\n').filter(function (l) { return l.trim(); });
    if (lines.length) {
      state.text = lines.map(function (l, i) { return (i + 1) + '. ' + l; }).join('\n');
      state.notice = '사진에서 읽은 글을 아래 칸에 넣었어요. 틀린 글자는 고치고, 빠진 내용은 직접 적어 주세요.';
    } else {
      state.error = '글자를 거의 읽지 못했어요. 직접 적어 주세요.';
    }
  } catch (err) {
    state.error = '사진 읽기에 실패했어요 (' + (err && err.message ? err.message : err) + '). 직접 적어 주세요.';
  }
  state.stage = 'write';
  render();
}

render();
</script>
